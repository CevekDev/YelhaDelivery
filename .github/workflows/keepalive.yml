name: Supabase keep-alive

# Ping quotidien d'un endpoint qui EFFECTUE une requête sur la base → empêche la
# mise en pause du projet Supabase (free tier) après ~7 j d'inactivité.
# Aucune config requise : cible l'URL de prod par défaut. Pour un domaine custom,
# définis la variable de dépôt PROD_URL
# (Settings → Secrets and variables → Actions → Variables).

on:
  schedule:
    - cron: '23 6 * * *' # tous les jours ~06:23 UTC (évite le rush de :00)
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          BASE="${{ vars.PROD_URL }}"
          if [ -z "$BASE" ]; then BASE="https://yelha-delivery.vercel.app"; fi
          URL="${BASE%/}/api/health"
          echo "Ping $URL"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 30 "$URL" || echo "000")
            echo "tentative $i → HTTP $code"
            cat /tmp/body 2>/dev/null; echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::keep-alive: /api/health n'a pas répondu 200 (base injoignable ?)"
          exit 1
